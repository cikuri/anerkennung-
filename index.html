<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-phrases {
            position: absolute; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .falling-text {
            position: absolute;
            color: #800020;
            font-size: 12px;
            opacity: 0.27; 
            user-select: none;
            white-space: nowrap;
        }

        #start-btn {
            position: relative;
            padding: 15px 35px;
            background-color: #000;
            border: 2px solid #800020;
            color: #800020;
            font-size: 16px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            z-index: 100;
            border-radius: 40px;
            transition: 0.3s;
        }

        #start-btn:hover { box-shadow: 0 0 20px #800020; background-color: rgba(128, 0, 32, 0.1); }

        #heart-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            transform-origin: center;
        }

        #drawing-canvas {
            position: absolute;
            width: 100vw; height: 100vh;
            z-index: 50;
            display: none;
            touch-action: none;
        }

        .heart-phrase {
            position: absolute;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #signature {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #800020;
            font-size: 14px;
            opacity: 0;
            z-index: 10;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
        }

        /* ТИХОЕ БИЕНИЕ (не вылетает за экран) */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        .beating {
            animation: heartBeat 0.8s infinite !important;
        }

        /* Мерцание слоев по твоим настройкам */
        @keyframes blink-top { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.34); } }
        @keyframes blink-mid { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.50); } }
        @keyframes blink-low { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.65); } }

        .blink-0 { animation: blink-top 6s infinite ease-in-out; }
        .blink-1 { animation: blink-mid 6s infinite ease-in-out; }
        .blink-2 { animation: blink-low 6s infinite ease-in-out; }

        @media (max-width: 600px) {
            #signature { font-size: 11px; bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <div id="bg-phrases"></div>
    <button id="start-btn">Открыть</button>
    <div id="heart-container"></div>
    <canvas id="drawing-canvas"></canvas>
    <div id="signature">insbesondere für Sofia Mjaukowna</div>

    <script>
        const bgContainer = document.getElementById('bg-phrases');
        const heartContainer = document.getElementById('heart-container');
        const canvas = document.getElementById('drawing-canvas');
        const btn = document.getElementById('start-btn');
        const signature = document.getElementById('signature');

        const compliments = [
            "Ich ertrinke in deinen Augen", "Ich mag dich",
            "du bist ein geschenk des schicksals", "du bist die schönste",
            "dein lächeln ist wunderschön", "deine stimme wie ein engelsgesang"
        ];

        function spawnBgText(initialY = -50) {
            const span = document.createElement('span');
            span.className = 'falling-text';
            span.innerText = compliments[Math.floor(Math.random() * compliments.length)];
            const xPos = Math.random() * 100;
            span.style.left = xPos + 'vw';
            let top = initialY;
            const speed = Math.random() * 0.7 + 0.3;
            bgContainer.appendChild(span);
            function move() {
                top += speed;
                span.style.top = top + 'px';
                if (top < window.innerHeight) requestAnimationFrame(move);
                else span.remove();
            }
            move();
        }

        for (let i = 0; i < 75; i++) spawnBgText(Math.random() * window.innerHeight);
        let bgInterval = setInterval(() => spawnBgText(-50), 450);

        function createHeart() {
            btn.style.display = 'none';
            clearInterval(bgInterval);
            bgContainer.style.opacity = '0';
            bgContainer.style.transition = 'opacity 1.5s';
            signature.style.opacity = '1';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const isMobile = window.innerWidth < 600;

            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const layers = [
                { count: 140, scale: isMobile ? 9 : 15, opacity: 1 },
                { count: 100, scale: isMobile ? 6.5 : 11, opacity: 0.66 },
                { count: 70, scale: isMobile ? 4 : 7, opacity: 0.33 }
            ];

            let allHeartPhrases = [];
            layers.forEach((layer, index) => {
                for (let i = 0; i < layer.count; i++) {
                    const span = document.createElement('span');
                    span.className = 'heart-phrase';
                    span.innerText = 'ich liebe dich';
                    span.style.color = '#800020';
                    span.dataset.layerIndex = index;
                    const t = (i / layer.count) * Math.PI * 2;
                    const x = layer.scale * 16 * Math.pow(Math.sin(t), 3) * 1.1;
                    const y = -layer.scale * (14 * Math.cos(t) - 5.5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    span.style.left = (centerX + x - 35) + 'px';
                    span.style.top = (centerY + y) + 'px';
                    heartContainer.appendChild(span);
                    allHeartPhrases.push(span);
                    setTimeout(() => { span.style.opacity = layer.opacity; }, Math.random() * 2600); 
                }
            });

            setTimeout(() => {
                allHeartPhrases.forEach(p => {
                    if (Math.random() > 0.5) {
                        p.classList.add('blink-' + p.dataset.layerIndex);
                        p.style.animationDelay = (Math.random() * 4) + 's';
                    }
                });
            }, 3500);

            let isDrawing = false;
            let sectorsTouched = new Set();
            const totalSectors = 12;
            const radiusThreshold = isMobile ? 120 : 200;

            function checkTrace(x, y) {
                const dx = x - centerX;
                const dy = y - centerY;
                const distance = Math.sqrt(dx*dx + dy*dy);

                if (distance > radiusThreshold * 0.5 && distance < radiusThreshold * 1.6) {
                    const angle = Math.atan2(dy, dx);
                    const sector = Math.floor(((angle + Math.PI) / (Math.PI * 2)) * totalSectors);
                    sectorsTouched.add(sector);

                    if (sectorsTouched.size === totalSectors) {
                        triggerBeat();
                        sectorsTouched.clear();
                    }
                }
            }

            function triggerBeat() {
                if (heartContainer.classList.contains('beating')) return;
                
                let count = 0;
                heartContainer.classList.add('beating');
                
                const onBeat = () => {
                    count++;
                    if (count >= 10) {
                        heartContainer.classList.remove('beating');
                        heartContainer.removeEventListener('animationiteration', onBeat);
                    }
                };
                
                heartContainer.addEventListener('animationiteration', onBeat);
            }

            canvas.addEventListener('mousedown', () => { isDrawing = true; sectorsTouched.clear(); });
            canvas.addEventListener('mouseup', () => { isDrawing = false; sectorsTouched.clear(); });
            canvas.addEventListener('mousemove', (e) => { if(isDrawing) checkTrace(e.clientX, e.clientY); });
            
            canvas.addEventListener('touchstart', () => { isDrawing = true; sectorsTouched.clear(); });
            canvas.addEventListener('touchend', () => { isDrawing = false; sectorsTouched.clear(); });
            canvas.addEventListener('touchmove', (e) => { 
                if(isDrawing) checkTrace(e.touches[0].clientX, e.touches[0].clientY); 
            });
        }

        btn.addEventListener('click', createHeart);
    </script>
</body>
</html>
