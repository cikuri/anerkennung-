<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-phrases {
            position: absolute; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .falling-text {
            position: absolute;
            color: #800020;
            font-size: 12px;
            opacity: 0.27; /* ЯРКОСТЬ МАТРИЦЫ */
            user-select: none;
            white-space: nowrap;
        }

        #start-btn {
            position: relative;
            padding: 15px 35px;
            background-color: #000;
            border: 2px solid #800020;
            color: #800020;
            font-size: 16px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            z-index: 100;
            border-radius: 40px;
            transition: 0.3s;
        }

        #heart-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            transform-origin: center;
        }

        #drawing-canvas {
            position: absolute;
            width: 100vw; height: 100vh;
            z-index: 50;
            display: none;
            touch-action: none;
        }

        .heart-phrase {
            position: absolute;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #signature {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #800020;
            font-size: 14px;
            opacity: 0;
            z-index: 10;
            transition: opacity 1s;
        }

        /* АНИМАЦИЯ БИЕНИЯ */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        .beating {
            animation: heartBeat 0.8s infinite !important;
        }

        /* Твои настройки мерцания */
        @keyframes blink-0 { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.34); } }
        @keyframes blink-1 { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.50); } }
        @keyframes blink-2 { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.65); } }

        .blink-0 { animation: blink-0 6s infinite ease-in-out; }
        .blink-1 { animation: blink-1 6s infinite ease-in-out; }
        .blink-2 { animation: blink-2 6s infinite ease-in-out; }
    </style>
</head>
<body>

    <div id="bg-phrases"></div>
    <button id="start-btn">Открыть</button>
    <div id="heart-container"></div>
    <canvas id="drawing-canvas"></canvas>
    <div id="signature">insbesondere für Sofia Mjaukowna</div>

    <script>
        const bgContainer = document.getElementById('bg-phrases');
        const heartContainer = document.getElementById('heart-container');
        const canvas = document.getElementById('drawing-canvas');
        const btn = document.getElementById('start-btn');
        const signature = document.getElementById('signature');

        const compliments = ["Ich ertrinke in deinen Augen", "Ich mag dich", "du bist ein geschenk des schicksals", "du bist die schönste"];

        function spawnBgText() {
            const span = document.createElement('span');
            span.className = 'falling-text';
            span.innerText = compliments[Math.floor(Math.random() * compliments.length)];
            span.style.left = Math.random() * 100 + 'vw';
            let top = -50;
            bgContainer.appendChild(span);
            function move() {
                top += 1.5;
                span.style.top = top + 'px';
                if (top < window.innerHeight) requestAnimationFrame(move);
                else span.remove();
            }
            move();
        }

        let bgInterval = setInterval(spawnBgText, 400);

        function createHeart() {
            btn.style.display = 'none';
            clearInterval(bgInterval); // Останавливаем спавн новых, старые долетят
            signature.style.opacity = '1';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const isMobile = window.innerWidth < 600;

            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const layers = [
                { count: 140, scale: isMobile ? 9 : 15, opacity: 1 },
                { count: 100, scale: isMobile ? 6.5 : 11, opacity: 0.66 },
                { count: 70, scale: isMobile ? 4 : 7, opacity: 0.33 }
            ];

            let allPhrases = [];
            layers.forEach((layer, index) => {
                for (let i = 0; i < layer.count; i++) {
                    const span = document.createElement('span');
                    span.className = 'heart-phrase';
                    span.innerText = 'ich liebe dich';
                    span.style.color = '#800020';
                    const t = (i / layer.count) * Math.PI * 2;
                    const x = layer.scale * 16 * Math.pow(Math.sin(t), 3) * 1.1;
                    const y = -layer.scale * (14 * Math.cos(t) - 5.5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    span.style.left = (centerX + x - 35) + 'px';
                    span.style.top = (centerY + y) + 'px';
                    heartContainer.appendChild(span);
                    allPhrases.push({el: span, layer: index, targetOpacity: layer.opacity});
                    setTimeout(() => { span.style.opacity = layer.opacity; }, Math.random() * 2000);
                }
            });

            setTimeout(() => {
                allPhrases.forEach(p => {
                    if (Math.random() > 0.5) p.el.classList.add('blink-' + p.layer);
                });
            }, 3000);

            // ЛОГИКА ИНТЕРАКТИВА
            let sectors = new Set();
            let isDrawing = false;
            let isBeating = false;

            function triggerBeat() {
                if (isBeating) return;
                isBeating = true;
                heartContainer.classList.add('beating');

                // Ровно 10 ударов по 0.8 секунд = 8000мс
                setTimeout(() => {
                    heartContainer.classList.remove('beating');
                    isBeating = false;
                }, 8000);
            }

            function check(x, y) {
                const dx = x - centerX, dy = y - centerY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 100 && dist < 300) {
                    const angle = Math.atan2(dy, dx);
                    sectors.add(Math.floor(((angle + Math.PI) / (Math.PI * 2)) * 12));
                    if (sectors.size === 12) { triggerBeat(); sectors.clear(); }
                }
            }

            canvas.addEventListener('mousedown', () => { isDrawing = true; sectors.clear(); });
            window.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', (e) => { if(isDrawing) check(e.clientX, e.clientY); });
            canvas.addEventListener('touchstart', () => { isDrawing = true; sectors.clear(); });
            window.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', (e) => { if(isDrawing) check(e.touches[0].clientX, e.touches[0].clientY); });
        }

        btn.addEventListener('click', createHeart);
    </script>
</body>
</html>
