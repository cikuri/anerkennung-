<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>anerkennung</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-phrases {
            position: absolute; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            transition: opacity 1.33s ease-in-out; /* ИСЧЕЗНОВЕНИЕ ЗА 1.33С */
        }

        .falling-text {
            position: absolute;
            color: #800020;
            font-size: 12px;
            opacity: 0.27; 
            user-select: none;
            white-space: nowrap;
        }

        #start-btn {
            position: relative;
            padding: 15px 35px;
            background-color: #000;
            border: 2px solid #800020;
            color: #800020;
            font-size: 16px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            z-index: 100;
            border-radius: 40px;
        }

        #heart-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            transform-origin: center;
        }

        #drawing-canvas {
            position: absolute;
            width: 100vw; height: 100vh;
            z-index: 50;
            display: none;
            touch-action: none;
        }

        .heart-phrase {
            position: absolute;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 2s ease;
            color: #800020;
        }

        #signature {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #800020;
            font-size: 14px;
            opacity: 0;
            z-index: 10;
            transition: opacity 1s;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        .beating {
            animation: heartBeat 0.8s infinite !important;
        }

        @keyframes blink-top { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.34); } }
        @keyframes blink-mid { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.50); } }
        @keyframes blink-low { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.65); } }

        .blink-0 { animation: blink-top 6s infinite ease-in-out; }
        .blink-1 { animation: blink-mid 6s infinite ease-in-out; }
        .blink-2 { animation: blink-low 6s infinite ease-in-out; }
    </style>
</head>
<body>

    <div id="bg-phrases"></div>
    <button id="start-btn">Открыть</button>
    <div id="heart-container"></div>
    <canvas id="drawing-canvas"></canvas>
    <div id="signature">insbesondere für Sofia Mjaukowna</div>

    <script>
        const bgContainer = document.getElementById('bg-phrases');
        const heartContainer = document.getElementById('heart-container');
        const canvas = document.getElementById('drawing-canvas');
        const btn = document.getElementById('start-btn');
        const signature = document.getElementById('signature');

        const compliments = ["Ich ertrinke in deinen Augen", "Ich mag dich", "du bist ein geschenk des schicksals", "du bist die schönste", "dein lächeln ist wunderschön"];

        function spawnBgText(yPos) {
            const span = document.createElement('span');
            span.className = 'falling-text';
            span.innerText = compliments[Math.floor(Math.random() * compliments.length)];
            span.style.left = Math.random() * 100 + 'vw';
            let top = yPos;
            span.style.top = top + 'px';
            bgContainer.appendChild(span);
            function move() {
                top += 1.2;
                span.style.top = top + 'px';
                if (top < window.innerHeight) {
                    if (bgContainer.style.opacity !== '0') requestAnimationFrame(move);
                } else {
                    span.remove();
                }
            }
            move();
        }

        // ЗАПОЛНЯЕМ ЭКРАН СРАЗУ
        for (let i = 0; i < 80; i++) {
            spawnBgText(Math.random() * window.innerHeight);
        }
        
        let bgInterval = setInterval(() => spawnBgText(-50), 450);

        function createHeart() {
            btn.style.display = 'none';
            
            // ИСЧЕЗНОВЕНИЕ МАТРИЦЫ
            clearInterval(bgInterval);
            bgContainer.style.opacity = '0';
            setTimeout(() => { bgContainer.innerHTML = ''; }, 1330);

            signature.style.opacity = '1';
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const isMobile = window.innerWidth < 600;

            const layers = [
                { count: 140, scale: isMobile ? 9 : 15, opacity: 1 },
                { count: 100, scale: isMobile ? 6.5 : 11, opacity: 0.66 },
                { count: 70, scale: isMobile ? 4 : 7, opacity: 0.33 }
            ];

            let allHeartPhrases = [];
            layers.forEach((layer, index) => {
                for (let i = 0; i < layer.count; i++) {
                    const span = document.createElement('span');
                    span.className = 'heart-phrase';
                    span.innerText = 'ich liebe dich';
                    const t = (i / layer.count) * Math.PI * 2;
                    const x = layer.scale * 16 * Math.pow(Math.sin(t), 3) * 1.1;
                    const y = -layer.scale * (14 * Math.cos(t) - 5.5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    span.style.left = (cx + x - 35) + 'px';
                    span.style.top = (cy + y) + 'px';
                    heartContainer.appendChild(span);
                    allHeartPhrases.push({el: span, layer: index, opacity: layer.opacity});
                    setTimeout(() => { span.style.opacity = layer.opacity; }, Math.random() * 2000); 
                }
            });

            setTimeout(() => {
                allHeartPhrases.forEach(p => {
                    if (Math.random() > 0.5) {
                        p.el.classList.add('blink-' + p.layer);
                        p.el.style.animationDelay = (Math.random() * 5) + 's';
                    }
                });
            }, 3000);

            let sectorsTouched = new Set();
            let isDrawing = false;
            let beatCount = 0;

            function triggerBeat() {
                if (heartContainer.classList.contains('beating')) return;
                beatCount = 0;
                heartContainer.classList.add('beating');
                const onBeat = () => {
                    beatCount++;
                    if (beatCount >= 10) {
                        heartContainer.classList.remove('beating');
                        heartContainer.removeEventListener('animationiteration', onBeat);
                    }
                };
                heartContainer.addEventListener('animationiteration', onBeat);
            }

            function checkTrace(x, y) {
                const dx = x - cx, dy = y - cy;
                const distance = Math.sqrt(dx*dx + dy*dy);
                if (distance > 80 && distance < 350) {
                    const angle = Math.atan2(dy, dx);
                    const sector = Math.floor(((angle + Math.PI) / (Math.PI * 2)) * 12);
                    sectorsTouched.add(sector);
                    if (sectorsTouched.size === 12) {
                        triggerBeat();
                        sectorsTouched.clear();
                    }
                }
            }

            canvas.addEventListener('mousedown', () => { if(!heartContainer.classList.contains('beating')) sectorsTouched.clear(); isDrawing = true; });
            window.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', (e) => { if(isDrawing) checkTrace(e.clientX, e.clientY); });
            canvas.addEventListener('touchstart', () => { if(!heartContainer.classList.contains('beating')) sectorsTouched.clear(); isDrawing = true; });
            window.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', (e) => { if(isDrawing) checkTrace(e.touches[0].clientX, e.touches[0].clientY); });
        }

        btn.addEventListener('click', createHeart);
    </script>
</body>
</html>
