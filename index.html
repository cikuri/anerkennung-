<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            display: flex; justify-content: center; align-items: center;
        }
        #bg-phrases {
            position: absolute; width: 100%; height: 100%;
            z-index: 1; overflow: hidden; pointer-events: none;
            transition: opacity 1.25s ease-in-out;
        }
        .falling-text {
            position: absolute; color: #800020; font-size: 12px;
            opacity: 0.46; user-select: none; white-space: nowrap;
            transform: translateX(-50%);
        }
        #start-btn {
            position: relative; padding: 15px 35px; background-color: #000;
            border: 2px solid #800020; color: #800020; font-size: 16px;
            text-transform: uppercase; letter-spacing: 3px; cursor: pointer;
            z-index: 100; border-radius: 40px; outline: none;
        }
        #heart-container {
            position: absolute; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; transform-origin: center;
        }
        #drawing-canvas {
            position: absolute; width: 100vw; height: 100vh;
            z-index: 50; display: none; touch-action: none;
        }
        .heart-phrase {
            position: absolute; font-size: 9px; font-weight: bold;
            white-space: nowrap; opacity: 0; transition: opacity 3s ease;
            color: #800020;
        }
        #signature {
            position: absolute; bottom: 20px; right: 20px;
            color: #800020; font-size: 14px; opacity: 0;
            z-index: 10; transition: opacity 1s;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
        }
        .beating { animation: heartBeat 0.8s infinite; }
        @keyframes blink-0 { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.34); } }
        @keyframes blink-1 { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.50); } }
        @keyframes blink-2 { 0%, 100% { filter: opacity(1); } 50% { filter: opacity(0.65); } }
        .blink-0 { animation: blink-0 6s infinite ease-in-out; }
        .blink-1 { animation: blink-1 6s infinite ease-in-out; }
        .blink-2 { animation: blink-2 6s infinite ease-in-out; }
    </style>
</head>
<body>

    <div id="bg-phrases"></div>
    <button id="start-btn">Открыть</button>
    <div id="heart-container"></div>
    <canvas id="drawing-canvas"></canvas>
    <div id="signature">insbesondere für Sofia Mjaukowna</div>

    <script>
        const bg = document.getElementById('bg-phrases');
        const heartBox = document.getElementById('heart-container');
        const canvas = document.getElementById('drawing-canvas');
        const btn = document.getElementById('start-btn');
        const sig = document.getElementById('signature');

        let audioCtx;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playStartSwoosh() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(40, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.25);
        }

        function playAmbient() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(55, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.25);
        }

        function playSparkle() {
            let start = audioCtx.currentTime;
            const interval = setInterval(() => {
                let now = audioCtx.currentTime;
                let elapsed = now - start;
                let progress = elapsed / 5;
                if (progress > 1) progress = 1;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                // Мягкие гармоничные частоты (имитация колокольчиков)
                osc.frequency.setValueAtTime(300 + Math.random() * 300, now);
                
                gain.gain.setValueAtTime(0, now);
                // Громкость плавно растет к финалу сборки
                let maxG = 0.005 + (0.015 * progress); 
                gain.gain.linearRampToValueAtTime(maxG, now + 0.2);
                gain.gain.linearRampToValueAtTime(0, now + 1.0);
                
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(now + 1.1);
            }, 500);
            setTimeout(() => clearInterval(interval), 5000);
        }

        function playHeartBeat() {
            const now = audioCtx.currentTime;
            // Удар 1 (ТУ) - Глубокий бас точно в момент расширения
            const osc1 = audioCtx.createOscillator();
            const g1 = audioCtx.createGain();
            osc1.frequency.setValueAtTime(50, now);
            osc1.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
            g1.gain.setValueAtTime(0.5, now);
            g1.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc1.connect(g1); g1.connect(audioCtx.destination);
            osc1.start(); osc1.stop(now + 0.5);

            // Удар 2 (ДУМ) - Вторая фаза толчка
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                osc2.frequency.setValueAtTime(35, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                g2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                g2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc2.connect(g2); g2.connect(audioCtx.destination);
                osc2.start(); osc2.stop(audioCtx.currentTime + 0.4);
            }, 150);
        }

        const words = ["Ich ertrinke in deinen Augen", "Ich mag dich", "du bist ein geschenk des schicksals", "du bist die schönste", "dein lächeln ist wunderschön"];
        function spawn(y = -50) {
            if (document.hidden) return;
            const span = document.createElement('span');
            span.className = 'falling-text';
            span.innerText = words[Math.floor(Math.random() * words.length)];
            span.style.left = Math.random() * 100 + 'vw';
            let top = y;
            const speed = Math.random() * 0.8 + 0.6;
            span.style.top = top + 'px';
            bg.appendChild(span);
            function move() {
                top += speed;
                span.style.top = top + 'px';
                if (top < window.innerHeight + 100) requestAnimationFrame(move);
                else span.remove();
            }
            move();
        }
        for(let i=0; i<80; i++) spawn(Math.random() * window.innerHeight);
        let matrixInterval = setInterval(() => spawn(-50), 400);

        function openHeart() {
            initAudio();
            playStartSwoosh();
            playAmbient();
            setTimeout(playSparkle, 1000);

            btn.style.display = 'none';
            clearInterval(matrixInterval);
            bg.style.opacity = '0';
            setTimeout(() => { bg.style.display = 'none'; }, 1250);

            sig.style.opacity = '1';
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            const mobile = window.innerWidth < 600;
            const layers = [
                { c: 140, s: mobile ? 9 : 15, o: 1 },
                { c: 100, s: mobile ? 6.5 : 11, o: 0.66 },
                { c: 70, s: mobile ? 4 : 7, o: 0.33 }
            ];

            let heartPhrases = [];
            layers.forEach((l, idx) => {
                for (let i = 0; i < l.c; i++) {
                    const span = document.createElement('span');
                    span.className = 'heart-phrase';
                    span.innerText = 'ich liebe dich';
                    const t = (i / l.c) * Math.PI * 2;
                    const x = l.s * 16 * Math.pow(Math.sin(t), 3) * 1.1;
                    const y = -l.s * (14 * Math.cos(t) - 5.5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    span.style.left = (cx + x - 35) + 'px';
                    span.style.top = (cy + y) + 'px';
                    heartBox.appendChild(span);
                    heartPhrases.push({el: span, l: idx});
                    setTimeout(() => { span.style.opacity = l.o; }, Math.random() * 5000);
                }
            });

            setTimeout(() => {
                heartPhrases.forEach(p => {
                    if (Math.random() > 0.5) {
                        p.el.classList.add('blink-' + Math.floor(Math.random()*3));
                        p.el.style.animationDelay = (Math.random()*5) + 's';
                    }
                });
            }, 6000);

            let sectors = new Set();
            let active = false;
            function doBeat() {
                if (active) return;
                active = true;
                heartBox.classList.add('beating');
                let count = 0;
                let beatTimer = setInterval(() => {
                    playHeartBeat(); // СТРОГАЯ СИНХРОНИЗАЦИЯ
                    count++;
                    if (count >= 10) {
                        clearInterval(beatTimer);
                        heartBox.classList.remove('beating');
                        active = false;
                    }
                }, 800);
            }

            function check(x, y) {
                const dx = x - cx, dy = y - cy;
                if (Math.sqrt(dx*dx + dy*dy) > 70) {
                    const a = Math.atan2(dy, dx);
                    sectors.add(Math.floor(((a + Math.PI) / (Math.PI * 2)) * 12));
                    if (sectors.size === 12) { doBeat(); sectors.clear(); }
                }
            }

            canvas.onmousedown = () => { if(!active) sectors.clear(); canvas.drawing = true; };
            window.onmouseup = () => canvas.drawing = false;
            canvas.onmousemove = (e) => { if(canvas.drawing) check(e.clientX, e.clientY); };
            canvas.ontouchstart = () => { if(!active) sectors.clear(); canvas.drawing = true; };
            window.ontouchend = () => canvas.drawing = false;
            canvas.ontouchmove = (e) => { if(canvas.drawing) check(e.touches[0].clientX, e.touches[0].clientY); };
        }
        btn.onclick = openHeart;
    </script>
</body>
</html>
