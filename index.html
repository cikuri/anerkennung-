<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            display: flex; justify-content: center; align-items: center;
        }
        #bg-phrases {
            position: absolute; width: 100%; height: 100%;
            z-index: 1; overflow: hidden; pointer-events: none;
            transition: opacity 1.25s ease-in-out;
        }
        .falling-text {
            position: absolute; color: #800020; font-size: 12px;
            opacity: 0.46; user-select: none; white-space: nowrap;
            transform: translateX(-50%);
        }
        #start-btn {
            position: relative; padding: 15px 35px; background-color: #000;
            border: 2px solid #800020; color: #800020; font-size: 16px;
            text-transform: uppercase; letter-spacing: 3px; cursor: pointer;
            z-index: 100; border-radius: 40px; outline: none;
        }
        #heart-container {
            position: absolute; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; transform-origin: center;
            display: flex; justify-content: center; align-items: center;
        }
        #drawing-canvas {
            position: absolute; width: 100vw; height: 100vh;
            z-index: 50; display: none; touch-action: none;
        }
        .heart-phrase {
            position: absolute; font-size: 9px; font-weight: bold;
            white-space: nowrap; opacity: 0; transition: opacity 3s ease;
            color: #800020;
        }
        /* Улучшенные стили волны */
        .heart-wave {
            position: absolute;
            width: 300px; height: 300px;
            border: 3px solid #800020;
            opacity: 0.5;
            box-shadow: 0 0 20px #800020;
            pointer-events: none;
            z-index: 10; 
            clip-path: path("M150,45 C110,-20 20,-20 20,70 C20,130 150,230 150,265 C150,230 280,130 280,70 C280,-20 190,-20 150,45 Z");
            background: transparent;
            transform-origin: center center;
        }
        #signature {
            position: absolute; bottom: 20px; right: 20px;
            color: #800020; font-size: 14px; opacity: 0;
            z-index: 10; transition: opacity 1s;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
        }
        .beating { animation: heartBeat 0.8s infinite; }
    </style>
</head>
<body>

    <div id="bg-phrases"></div>
    <button id="start-btn">Открыть</button>
    <div id="heart-container"></div>
    <canvas id="drawing-canvas"></canvas>
    <div id="signature">insbesondere für Sofia Mjaukowna</div>

    <script>
        const bg = document.getElementById('bg-phrases');
        const heartBox = document.getElementById('heart-container');
        const canvas = document.getElementById('drawing-canvas');
        const btn = document.getElementById('start-btn');
        const sig = document.getElementById('signature');

        let audioCtx;
        let waveSoundBuffer;

        const words = [
            "ich ertrinke in deinen augen", 
            "ich mag dich", 
            "du bist ein geschenk des schicksals", 
            "du bist die schönste", 
            "dein lächeln ist wunderschön"
        ];

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                try {
                    const response = await fetch('yodguard-healing-magic-4-378668.mp3');
                    const arrayBuffer = await response.arrayBuffer();
                    waveSoundBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                } catch (e) { console.log("Audio load failed"); }
            }
        }

        function playWaveSound() {
            if (waveSoundBuffer && audioCtx) {
                const source = audioCtx.createBufferSource();
                const gain = audioCtx.createGain();
                source.buffer = waveSoundBuffer;
                gain.gain.setValueAtTime(0.34, audioCtx.currentTime);
                source.connect(gain);
                gain.connect(audioCtx.destination);
                source.start(0);
            }
        }

        function triggerWave() {
            playWaveSound(); 
            const wave = document.createElement('div');
            wave.className = 'heart-wave';
            heartBox.appendChild(wave); // Теперь внутри контейнера сердца
            
            let scale = 0.5;
            let opacity = 0.5;
            
            // Волна должна скрыться за 1.33с
            const startTime = Date.now();
            const duration = 1330; 

            const animate = () => {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;

                if (progress < 1) {
                    scale = 0.5 + (progress * 5); // Быстрое расширение
                    wave.style.transform = `scale(${scale})`;
                    requestAnimationFrame(animate);
                } else {
                    wave.remove();
                }
            };

            const fadeInterval = setInterval(() => {
                opacity -= 0.075; // 7.5% каждые 100мс
                wave.style.opacity = Math.max(0, opacity);
                if (opacity <= 0) clearInterval(fadeInterval);
            }, 100);

            requestAnimationFrame(animate);
        }

        function spawn(y = -50) {
            if (document.hidden) return;
            const span = document.createElement('span');
            span.className = 'falling-text';
            span.innerText = words[Math.floor(Math.random() * words.length)];
            span.style.left = Math.random() * 100 + 'vw';
            let top = y;
            const speed = Math.random() * 0.8 + 0.6;
            span.style.top = top + 'px';
            bg.appendChild(span);
            function move() {
                top += speed;
                span.style.top = top + 'px';
                if (top < window.innerHeight + 100) requestAnimationFrame(move);
                else span.remove();
            }
            move();
        }

        for(let i=0; i<80; i++) spawn(Math.random() * window.innerHeight);
        let matrixInterval = setInterval(() => spawn(-50), 400);

        let isAssembled = false;

        async function openHeart() {
            await initAudio();
            btn.style.display = 'none';
            clearInterval(matrixInterval);
            bg.style.opacity = '0';
            setTimeout(() => { bg.style.display = 'none'; }, 1250);

            sig.style.opacity = '1';
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            const mobile = window.innerWidth < 600;
            const layers = [
                { c: 140, s: mobile ? 9 : 15, o: 1 },
                { c: 100, s: mobile ? 6.5 : 11, o: 0.66 },
                { c: 70, s: mobile ? 4 : 7, o: 0.33 }
            ];

            layers.forEach((l, idx) => {
                for (let i = 0; i < l.c; i++) {
                    const span = document.createElement('span');
                    span.className = 'heart-phrase';
                    span.innerText = 'ich liebe dich';
                    const t = (i / l.c) * Math.PI * 2;
                    const x = l.s * 16 * Math.pow(Math.sin(t), 3) * 1.1;
                    const y = -l.s * (14 * Math.cos(t) - 5.5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    span.style.left = (cx + x - 35) + 'px';
                    span.style.top = (cy + y) + 'px';
                    heartBox.appendChild(span);
                    setTimeout(() => { span.style.opacity = l.o; }, Math.random() * 5000);
                }
            });

            setTimeout(() => {
                isAssembled = true;
                triggerWave(); 
            }, 5500);

            let sectors = new Set();
            let active = false;
            function check(x, y) {
                if (!isAssembled || active) return;
                const dx = x - cx, dy = y - cy;
                if (Math.sqrt(dx*dx + dy*dy) > 70) {
                    const a = Math.atan2(dy, dx);
                    sectors.add(Math.floor(((a + Math.PI) / (Math.PI * 2)) * 12));
                    if (sectors.size === 12) {
                        active = true;
                        heartBox.classList.add('beating');
                        setTimeout(() => { heartBox.classList.remove('beating'); active = false; }, 8000);
                        sectors.clear();
                    }
                }
            }

            canvas.onmousedown = () => { if(isAssembled) sectors.clear(); canvas.drawing = true; };
            window.onmouseup = () => canvas.drawing = false;
            canvas.onmousemove = (e) => { if(canvas.drawing) check(e.clientX, e.clientY); };
            canvas.ontouchstart = () => { if(isAssembled) sectors.clear(); canvas.drawing = true; };
            canvas.ontouchmove = (e) => { if(canvas.drawing) check(e.touches[0].clientX, e.touches[0].clientY); };
        }
        btn.onclick = openHeart;
    </script>
</body>
</html>
