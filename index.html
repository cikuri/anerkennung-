<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        /* Базовые настройки */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Полностью черный экран */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* Контейнер для фраз */
        #heart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .phrase {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            color: #800020; /* Винный / Бордовый цвет */
            opacity: 0;
            transition: all 2.5s cubic-bezier(0.19, 1, 0.22, 1);
            text-shadow: 0 0 8px rgba(128, 0, 32, 0.6);
        }

        /* Центральная кнопка */
        #start-btn {
            position: relative;
            padding: 15px 40px;
            background-color: #1a1a1a; /* Темный фон кнопки */
            border: 2px solid #ff00ff; /* Розовая рамка */
            color: #ff00ff; /* Розовый текст */
            font-size: 18px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            z-index: 100;
            transition: 0.5s;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        #start-btn:hover {
            background-color: #ff00ff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
        }

        /* Анимация пульсации сердца */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .beating {
            animation: heartBeat 1.8s infinite ease-in-out;
        }

        /* Текст внутри сердца */
        #final-text {
            position: absolute;
            z-index: 10;
            color: #a52a2a;
            font-size: 2rem;
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease-in;
            text-shadow: 0 0 20px #800020;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .phrase { font-size: 9px; }
            #start-btn { font-size: 16px; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <button id="start-btn">Открыть</button>

    <div id="heart-container"></div>
    <h1 id="final-text">ICH LIEBE DICH</h1>

    <script>
        const container = document.getElementById('heart-container');
        const btn = document.getElementById('start-btn');
        const finalText = document.getElementById('final-text');
        
        const totalPhrases = 220; // Больше фраз для плотности

        // Создаем фразы заранее, но прячем их
        for (let i = 0; i < totalPhrases; i++) {
            const span = document.createElement('span');
            span.className = 'phrase';
            span.innerText = 'ich liebe dich';
            
            // Начальная позиция точно за кнопкой (в центре)
            span.style.left = '50%';
            span.style.top = '50%';
            span.style.transform = 'translate(-50%, -50%) scale(0)';
            
            container.appendChild(span);
        }

        btn.addEventListener('click', () => {
            // Исчезновение кнопки
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';

            const phrases = document.querySelectorAll('.phrase');
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // Коэффициент размера сердца
            const scale = window.innerWidth < 600 ? 10 : 16;

            phrases.forEach((p, i) => {
                const t = (i / totalPhrases) * Math.PI * 2;
                
                // Формула сердца
                const x = scale * 16 * Math.pow(Math.sin(t), 3);
                const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                // Разлет фраз из центра в форму сердца
                setTimeout(() => {
                    p.style.opacity = '0.8';
                    p.style.left = (centerX + x - 35) + 'px';
                    p.style.top = (centerY + y) + 'px';
                    p.style.transform = 'scale(1)';
                }, i * 15); // Задержка создает эффект "выползания"
            });

            // Появление финальной надписи и начало пульсации
            setTimeout(() => {
                finalText.style.opacity = '1';
                container.classList.add('beating');
            }, 3500);
        });
    </script>
</body>
</html>
