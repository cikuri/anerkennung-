<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Комплименты на фоне */
        #bg-phrases {
            position: absolute; width: 100%; height: 100%;
            z-index: 1;
        }

        .falling-text {
            position: absolute;
            color: #500; /* Темно-красный для фона */
            font-size: 12px;
            white-space: nowrap;
            opacity: 0.5;
        }

        /* Кнопка в стиле видео */
        #start-btn {
            position: relative;
            padding: 15px 35px;
            background-color: #000; /* Черная заливка */
            border: 2px solid #800020; /* Красный контур */
            color: #800020; /* Красный текст */
            font-size: 16px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            z-index: 100;
            border-radius: 40px;
            transition: 0.3s;
        }

        #start-btn:hover {
            box-shadow: 0 0 20px #800020;
            color: #a00;
        }

        /* Сердце */
        #heart-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .heart-phrase {
            position: absolute;
            font-size: 9px;
            color: #800020;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        .beating { animation: beat 1.5s infinite ease-in-out; }
    </style>
</head>
<body>

    <div id="bg-phrases"></div>
    <button id="start-btn">Открыть</button>
    <div id="heart-container"></div>

    <script>
        const bgContainer = document.getElementById('bg-phrases');
        const heartContainer = document.getElementById('heart-container');
        const btn = document.getElementById('start-btn');

        const compliments = [
            "Ich ertrinke in deinen Augen", "Ich mag dich",
            "du bist ein geschenk des schicksals", "du bist die schönste",
            "dein lächeln ist wunderschön", "deine stimme klingt wie ein engelsgesang"
        ];

        // Создание падающих фраз
        function spawnBgText() {
            const span = document.createElement('span');
            span.className = 'falling-text';
            span.innerText = compliments[Math.floor(Math.random() * compliments.length)];
            span.style.left = Math.random() * 90 + 'vw';
            
            let top = -50;
            const speed = Math.random() * 1 + 0.5;
            bgContainer.appendChild(span);

            function move() {
                top += speed;
                span.style.top = top + 'px';
                if (top < window.innerHeight) {
                    requestAnimationFrame(move);
                } else {
                    span.remove();
                }
            }
            move();
        }

        let bgInterval = setInterval(spawnBgText, 700);

        // Функция создания сердца
        function createHeart() {
            // Убираем кнопку и фон
            btn.style.display = 'none';
            clearInterval(bgInterval);
            bgContainer.style.opacity = '0';
            bgContainer.style.transition = 'opacity 1s';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const isMobile = window.innerWidth < 600;

            // Рисуем два контура (внешний и внутренний)
            const layers = [
                { count: 120, scale: isMobile ? 9 : 15 }, // Внешний
                { count: 80, scale: isMobile ? 6 : 10 }   // Внутренний
            ];

            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    const span = document.createElement('span');
                    span.className = 'heart-phrase';
                    span.innerText = 'ich liebe dich';

                    const t = (i / layer.count) * Math.PI * 2;
                    const x = layer.scale * 16 * Math.pow(Math.sin(t), 3);
                    const y = -layer.scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                    span.style.left = (centerX + x - 30) + 'px';
                    span.style.top = (centerY + y) + 'px';

                    heartContainer.appendChild(span);

                    // Плавное рандомное появление
                    setTimeout(() => {
                        span.style.opacity = '1';
                    }, Math.random() * 2000);
                }
            });

            setTimeout(() => {
                heartContainer.classList.add('beating');
            }, 2000);
        }

        btn.addEventListener('click', createHeart);
    </script>
</body>
</html>
