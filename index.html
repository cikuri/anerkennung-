<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Dich</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-phrases {
            position: absolute; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .falling-text {
            position: absolute;
            color: #800020;
            font-size: 12px;
            opacity: 0.27; 
            user-select: none;
            white-space: nowrap;
        }

        #start-btn {
            position: relative;
            padding: 15px 35px;
            background-color: #000;
            border: 2px solid #800020;
            color: #800020;
            font-size: 16px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            z-index: 100;
            border-radius: 40px;
            transition: 0.3s;
        }

        #start-btn:hover {
            box-shadow: 0 0 20px #800020;
            background-color: rgba(128, 0, 32, 0.1);
        }

        #heart-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .heart-phrase {
            position: absolute;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 2s ease;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.33; }
        }

        .blinking {
            animation: blink 3s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div id="bg-phrases"></div>
    <button id="start-btn">Открыть</button>
    <div id="heart-container"></div>

    <script>
        const bgContainer = document.getElementById('bg-phrases');
        const heartContainer = document.getElementById('heart-container');
        const btn = document.getElementById('start-btn');

        const compliments = [
            "Ich ertrinke in deinen Augen", 
            "Ich mag dich",
            "du bist ein geschenk des schicksals", 
            "du bist die schönste",
            "dein lächeлн ist wunderschön", 
            "deine stimme wie ein engelsgesang" // Твоя новая фраза
        ];

        function spawnBgText(initialY = -50) {
            const span = document.createElement('span');
            span.className = 'falling-text';
            span.innerText = compliments[Math.floor(Math.random() * compliments.length)];
            
            // Распределение по всей ширине
            const xPos = Math.random() * 100;
            span.style.left = xPos + 'vw';
            
            // Центрируем фразу относительно точки спавна, чтобы она не уходила за правый край
            if (xPos > 50) {
                span.style.transform = 'translateX(-100%)';
            } else {
                span.style.transform = 'translateX(0)';
            }
            
            let top = initialY;
            const speed = Math.random() * 0.7 + 0.3;
            bgContainer.appendChild(span);

            function move() {
                top += speed;
                span.style.top = top + 'px';
                if (top < window.innerHeight) {
                    requestAnimationFrame(move);
                } else {
                    span.remove();
                }
            }
            move();
        }

        // Мгновенный старт матрицы
        for (let i = 0; i < 75; i++) {
            spawnBgText(Math.random() * window.innerHeight);
        }

        let bgInterval = setInterval(() => spawnBgText(-50), 450);

        function createHeart() {
            btn.style.display = 'none';
            clearInterval(bgInterval);
            bgContainer.style.opacity = '0';
            bgContainer.style.transition = 'opacity 1.5s';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const isMobile = window.innerWidth < 600;

            const layers = [
                { count: 140, scale: isMobile ? 9 : 15, opacity: 1 },
                { count: 100, scale: isMobile ? 6.5 : 11, opacity: 0.67 },
                { count: 70, scale: isMobile ? 4 : 7, opacity: 0.34 }
            ];

            let allHeartPhrases = [];

            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    const span = document.createElement('span');
                    span.className = 'heart-phrase';
                    span.innerText = 'ich liebe dich';
                    span.style.color = '#800020';

                    const t = (i / layer.count) * Math.PI * 2;
                    // Обновленная закругленная формула сердца
                    const x = layer.scale * 16 * Math.pow(Math.sin(t), 3) * 1.1;
                    const y = -layer.scale * (14 * Math.cos(t) - 5.5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                    span.style.left = (centerX + x - 35) + 'px';
                    span.style.top = (centerY + y) + 'px';

                    heartContainer.appendChild(span);
                    allHeartPhrases.push(span);

                    setTimeout(() => {
                        span.style.opacity = layer.opacity;
                    }, Math.random() * 2600); 
                }
            });

            // Запуск мерцания случайных слов
            setTimeout(() => {
                allHeartPhrases.forEach(p => {
                    if (Math.random() > 0.65) {
                        p.classList.add('blinking');
                        p.style.animationDelay = (Math.random() * 3) + 's';
                    }
                });
            }, 3000);
        }

        btn.addEventListener('click', createHeart);
    </script>
</body>
</html>
